<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="venue-title venue-desc">
  <title id="venue-title">Plan du campus JFN Hightech — DevFest Douala 2026</title>
  <desc id="venue-desc">Plan schématique du niveau 0 : Grand Amphithéâtre, Studio, Tech Lab, Espace partenaires, Accueil et Food court.</desc>

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#122033" stroke-width="0.6" />
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .room { cursor: pointer; }
      .room rect { fill: #0b1524; stroke: #23405c; stroke-width: 2; transition: fill 160ms ease, stroke 160ms ease; }
      .room:hover rect { fill: #102338; stroke: #3f6f96; }
      .room:focus { outline: none; }
      .room.is-active rect { fill: #0c3a31; stroke: #5cf2c4; stroke-width: 2.5; filter: url(#glow); }
      .room text { fill: #d7e6f6; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 17px; font-weight: 600; letter-spacing: 0.04em; pointer-events: none; }
      .room text.sub { fill: #7f95ab; font-size: 11px; font-weight: 400; letter-spacing: 0.12em; }
      .label { fill: #5cf2c4; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; letter-spacing: 0.22em; }
      .muted { fill: #6b8199; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; letter-spacing: 0.08em; }
      .shell { fill: none; stroke: #2b4b68; stroke-width: 3; }
      .zone { fill: #08111d; stroke: #182b40; stroke-width: 1.5; }
      .booth { fill: #0f2136; stroke: #2a4a68; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#060b13" />
  <rect width="1200" height="760" fill="url(#grid)" opacity="0.55" />

  <text x="64" y="52" class="label">SHELL // VENUE MAP</text>
  <text x="64" y="76" class="muted">JFN HIGHTECH · NIVEAU 0 · PLAN SCHÉMATIQUE</text>
  <text x="1136" y="52" class="muted" text-anchor="end">DEVFEST DOUALA · 2026</text>

  <!-- building shell -->
  <rect x="48" y="100" width="1104" height="590" rx="28" class="shell" />
  <rect x="64" y="116" width="1072" height="558" rx="20" class="zone" opacity="0.35" />

  <!-- main amphitheatre -->
  <g class="room is-active" data-room="main" tabindex="0" role="button" aria-label="Grand Amphithéâtre">
    <title>Grand Amphithéâtre — 300 places</title>
    <rect x="84" y="150" width="440" height="250" rx="14" />
    <text x="104" y="196">GRAND AMPHITHÉÂTRE</text>
    <text x="104" y="220" class="sub">300 PLACES · TALKS &amp; CÉRÉMONIES</text>
    <path d="M120 300 h360" stroke="#23405c" stroke-width="1" />
    <path d="M120 320 h360" stroke="#1c334a" stroke-width="1" />
    <path d="M120 340 h360" stroke="#1c334a" stroke-width="1" />
    <text x="104" y="378" class="sub">SCÈNE →</text>
  </g>

  <!-- studio -->
  <g class="room" data-room="studio" tabindex="0" role="button" aria-label="Studio">
    <title>Studio — 120 places</title>
    <rect x="548" y="150" width="272" height="150" rx="14" />
    <text x="568" y="196">STUDIO</text>
    <text x="568" y="220" class="sub">120 PLACES · WEB &amp; SECURITY</text>
  </g>

  <!-- tech lab -->
  <g class="room" data-room="lab" tabindex="0" role="button" aria-label="Tech Lab">
    <title>Tech Lab — 60 places</title>
    <rect x="844" y="150" width="276" height="150" rx="14" />
    <text x="864" y="196">TECH LAB</text>
    <text x="864" y="220" class="sub">60 PLACES · AI &amp; ATELIERS</text>
  </g>

  <!-- partners / expo -->
  <g class="room" data-room="expo" tabindex="0" role="button" aria-label="Espace partenaires">
    <title>Espace partenaires — stands et démos</title>
    <rect x="548" y="324" width="572" height="150" rx="14" />
    <text x="568" y="368">ESPACE PARTENAIRES</text>
    <text x="568" y="392" class="sub">STANDS · DÉMOS · NETWORKING</text>
    <rect class="booth" x="580" y="410" width="72" height="38" rx="6" />
    <rect class="booth" x="666" y="410" width="72" height="38" rx="6" />
    <rect class="booth" x="752" y="410" width="72" height="38" rx="6" />
    <rect class="booth" x="838" y="410" width="72" height="38" rx="6" />
    <rect class="booth" x="924" y="410" width="72" height="38" rx="6" />
    <rect class="booth" x="1010" y="410" width="72" height="38" rx="6" />
  </g>

  <!-- accueil -->
  <g class="room" data-room="accueil" tabindex="0" role="button" aria-label="Accueil et badge">
    <title>Accueil &amp; badge</title>
    <rect x="84" y="432" width="210" height="206" rx="14" />
    <text x="104" y="478">ACCUEIL</text>
    <text x="104" y="502" class="sub">&amp; BADGE</text>
    <text x="104" y="548" class="sub">QR SCAN →</text>
  </g>

  <!-- food court -->
  <g class="room" data-room="food" tabindex="0" role="button" aria-label="Food court">
    <title>Food court — pauses et déjeuner</title>
    <rect x="318" y="432" width="206" height="206" rx="14" />
    <text x="338" y="478">FOOD COURT</text>
    <text x="338" y="502" class="sub">CAFÉ · DÉJEUNER</text>
  </g>

  <!-- hall / non interactive -->
  <rect x="548" y="500" width="170" height="138" rx="12" fill="#0a1524" stroke="#1b3147" stroke-width="1.5" />
  <text x="568" y="540" class="sub">HALL</text>
  <text x="568" y="562" class="sub">NETWORKING</text>

  <!-- wc / logistics -->
  <rect x="742" y="500" width="170" height="138" rx="12" fill="#0a1524" stroke="#1b3147" stroke-width="1.5" />
  <text x="762" y="540" class="sub">WC · INFO</text>
  <text x="762" y="562" class="sub">POINT BÉNÉVOLES</text>

  <!-- exit -->
  <rect x="936" y="500" width="184" height="138" rx="12" fill="#0a1524" stroke="#1b3147" stroke-width="1.5" />
  <text x="956" y="540" class="sub">SORTIE</text>
  <text x="956" y="562" class="sub">VERS PARKING</text>

  <!-- entrance marker -->
  <path d="M600 690 v38" stroke="#5cf2c4" stroke-width="2" />
  <path d="M590 716 l10 12 10 -12" fill="none" stroke="#5cf2c4" stroke-width="2" />
  <text x="600" y="748" class="label" text-anchor="middle">ENTRÉE PRINCIPALE · SANTA BARBARA</text>

  <!-- legend -->
  <g transform="translate(64, 648)">
    <circle cx="6" cy="6" r="5" fill="#5cf2c4" />
    <text x="20" y="10" class="muted">SALLE SÉLECTIONNÉE</text>
    <circle cx="186" cy="6" r="5" fill="#23405c" />
    <text x="200" y="10" class="muted">SALLE DISPONIBLE</text>
    <text x="390" y="10" class="muted">PLAN NON À L'ÉCHELLE · ACCÈS PMR PAR L'ENTRÉE PRINCIPALE</text>
  </g>
</svg>
